name: Quality

on:
  push:
    branches:
      - main
    # Documentation is in no image and no code. THIRD_PARTY_NOTICES.md is in every
    # image, so it is not listed.
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CLA.md"
  # Every pull request runs: branch protection on main requires the Lint check, and a
  # skipped workflow would leave a documentation pull request waiting for it.
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync

      - name: Run lint checks
        run: make lint

  frontend:
    name: Frontend Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: make test-frontend

      - name: Build frontend
        run: make build-frontends
