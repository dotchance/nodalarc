repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deploy/helm/templates/
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: lint-policy
        name: lint policy
        entry: uv run python scripts/check-lint-policy.py
        language: system
        pass_filenames: false

      - id: builder-grammar-contract
        name: builder grammar contract (serializer output resolves + generated vocab fresh)
        entry: uv run pytest tests/unit/test_builder_serializer_contract.py tests/unit/test_builder_grammar_vocab_generated.py -q
        language: system
        pass_filenames: false
        files: '^(lib/nodalarc/models/.*\.py|frontend/src/builder/(workspace|workspaceImport|workspaceParseCore)\.ts|frontend/src/builder/generated/grammarVocab\.ts|scripts/gen_builder_grammar_vocab\.py|tests/fixtures/builder-serializer-corpus/.*)$'
