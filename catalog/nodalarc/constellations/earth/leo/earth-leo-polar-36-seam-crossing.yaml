constellation:
  id: earth-leo-polar-36-seam-crossing
  display_name: Earth polar LEO 36-satellite shell, seam-crossing phasing
  node: nodalarc:nodes/space/leo-relay.yaml
  orbit: nodalarc:orbits/earth/leo/earth-leo-iridium.yaml
  planes:
    count: 6
    raan_spacing_deg: 31.6
  slots_per_plane: 6
  phasing:
    mode: walker_star
    phase_offset_deg: 15.0
  node_tags:
  - tag: all
  reference: https://www.eoportal.org/satellite-missions/iridium-next
  notes: The earth-leo-polar-36 shell with a 15 degree inter-plane phase offset. That phasing brings the counter-rotating seam pairs with a two-slot offset (plane 5 slot N to plane 0 slot N+2) to a 230 km closest approach at 67 degrees latitude, a physically valid close pass whose line-of-sight angular rate peaks near 3.6 degrees per second, beyond what a 2 degree per second optical terminal can track. Authored for the polar-seam tracking experiment; not a model of a flown constellation.
