node:
  id: dtn-earth-gateway
  display_name: Earth LEO gateway carrying a DTN endpoint host
  forwarding: routed
  profile: nodalarc:profiles/frr-router.yaml
  ethernet:
  - id: terr0
  terminals:
  - id: access_ka
    role: access
    terminal: nodalarc:terminals/rf/rf-ka-leo-access.yaml
    count: 8
  payloads:
  - id: dtn
    payload: nodalarc:payloads/dtn-host.yaml
    profile: nodalarc:profiles/ud3tn-earth-endpoint.yaml
    count: 1
    attach: terr0
  reference: https://datatracker.ietf.org/doc/html/rfc9171
  notes: The leo-gateway model plus a mounted DTN endpoint host on its LAN
    port. The mount overrides the payload's default profile with the Earth
    endpoint composition. Site files choose installed terminal and payload
    counts.
