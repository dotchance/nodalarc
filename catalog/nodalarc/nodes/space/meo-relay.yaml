node:
  id: meo-relay
  display_name: MEO relay satellite node
  forwarding: routed
  profile: nodalarc:profiles/frr-router.yaml
  ethernet: []
  terminals:
  - id: access_ka
    role: access
    terminal: nodalarc:terminals/rf/rf-ka-meo-access.yaml
    count: 1
    boresight:
      mode: nadir
  - id: isl_optical
    role: isl
    terminal: nodalarc:terminals/optical/optical-high-orbit-isl.yaml
    count: 2
  - id: relay_optical
    role: crosslink
    terminal: nodalarc:terminals/optical/optical-cislunar-crosslink.yaml
    count: 2
  payloads: []
  reference: https://www.esa.int/Enabling_Support/Space_Operations/Types_of_orbits
  notes: Routed GPS-altitude MEO relay node with Earth access, medium-orbit ISLs, and optical crosslinks toward the high-orbit backbone.
