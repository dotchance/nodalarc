    role: access
    terminal: nodalarc:terminals/rf/rf-ka-starlink-space-gateway.yaml
    count: 1
    boresight:
      mode: nadir
  - id: isl_optical
    role: isl
    terminal: nodalarc:terminals/optical/optical-starlink-space-isl.yaml
    count: 4
  payloads: []
  reference: https://starlink.com/public-files/starlinkProgressReport_2024.pdf
  notes: Routed Starlink-like spacecraft model with Ka gateway access and optical ISLs.
