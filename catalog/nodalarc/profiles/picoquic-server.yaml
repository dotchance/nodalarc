# A QUIC server endpoint: one zero-capability container running upstream
# picoquic (built and published by the independent nodalarc-picoquic
# project, referenced here by pinned identity). No routing daemon; the
# platform attaches the host to its LAN and gateway at wiring time. Serves
# synthetic documents over QUIC on UDP 4433 with the image's demo
# certificates.
profile:
  id: picoquic-server
  display_name: QUIC server endpoint
  registry: node01:5000
  image: nodalarc-picoquic/picoquic@sha256:0ce1ef8b27da95fa286d6c1e0db76668323093c7046a44358499d335c7b2041a
  command:
  - /usr/local/bin/picoquicdemo
  - -p
  - '4433'
  - -c
  - /etc/picoquic/cert.pem
  - -k
  - /etc/picoquic/key.pem
  root_filesystem: read_only
  volumes:
  - name: tmp
    kind: ephemeral
    medium: memory
    size_mi: 16
  mounts:
  - volume: tmp
    path: /tmp
  resources:
    requests:
      cpu_m: 10
      memory_mi: 32
    limits:
      cpu_m: 500
      memory_mi: 128
  readiness:
    argv:
    - /bin/sh
    - -c
    - grep -qi ':1151' /proc/net/udp /proc/net/udp6
    timeout_seconds: 5
    period_seconds: 5
  terminal:
    surface: exec
    command:
    - /bin/bash
