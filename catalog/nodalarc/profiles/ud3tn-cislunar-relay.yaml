# The cislunar store-and-forward relay composition: an AAP 2.0 tools
# container in front of the upstream uD3TN daemon (built and published by
# D3TN, referenced by pinned identity). The daemon keeps the sqlite CLA
# for bundle storage and listens for mtcp peers. At startup the tools
# container schedules long static contacts toward both DTN endpoints,
# then idles; its terminal carries the aap2 tool set for driving the
# storage agent during an experiment. Endpoint addresses arrive as
# DTN_EARTH and DTN_LUNA, resolved by the platform from whichever nodes
# carry the dtn_earth and dtn_luna tags; no address is authored here.
profile:
  id: ud3tn-cislunar-relay
  display_name: uD3TN cislunar bundle relay
  registry: node01:5000
  image: nodalarc-ud3tn-tools/tools@sha256:869961d3f3436577ef44c5334aa0f8d9995721056c814067a9cf8fe4ac4c9123
  env:
  - name: DTN_EARTH
    value_from:
      tag: dtn_earth
      interface: terr0
      family: ipv4
  - name: DTN_LUNA
    value_from:
      tag: dtn_luna
      interface: terr0
      family: ipv4
  command:
  - /bin/bash
  - -c
  - >-
    set -u;
    S=/run/ud3tn/aap2.socket;
    until [ -S "$S" ]; do echo "waiting for aap2 socket"; sleep 2; done;
    until aap2-config --socket "$S" --schedule 1 315360000 1000000
    dtn://earth.dtn/ "mtcp:${DTN_EARTH}:4224";
    do echo "earth contact configuration failed; retrying"; sleep 5; done;
    until aap2-config --socket "$S" --schedule 1 315360000 1000000
    dtn://luna.dtn/ "mtcp:${DTN_LUNA}:4224";
    do echo "luna contact configuration failed; retrying"; sleep 5; done;
    echo "configured contacts to dtn://earth.dtn/ and dtn://luna.dtn/";
    exec sleep infinity
  root_filesystem: read_only
  volumes:
  - name: run
    kind: ephemeral
    medium: memory
    size_mi: 64
  mounts:
  - volume: run
    path: /run/ud3tn
    read_only: false
  terminal:
    surface: exec
    command:
    - /bin/bash
    - -l
  resources:
    requests: {cpu_m: 10, memory_mi: 32}
    limits: {cpu_m: 500, memory_mi: 128}
  sidecars:
  - name: ud3tn
    registry: registry.gitlab.com
    image: d3tn/ud3tn-docker-images/ud3tn@sha256:dbc27674995ba527c4e4a10a185e4827bb34a7aa5daac66fb3382cb668762103
    command:
    - /ud3tn
    - --node-id
    - dtn://relay.dtn/
    - --bp-version
    - '7'
    - --cla
    - sqlite:file::memory:?cache=shared;mtcp:*,4224
    - --aap-socket
    - /run/ud3tn/aap.socket
    - --aap2-socket
    - /run/ud3tn/aap2.socket
    - --log-level
    - '4'
    root_filesystem: read_only
    resources:
      requests: {cpu_m: 50, memory_mi: 64}
      limits: {cpu_m: 500, memory_mi: 256}
    mounts:
    - volume: run
      path: /run/ud3tn
      read_only: false
