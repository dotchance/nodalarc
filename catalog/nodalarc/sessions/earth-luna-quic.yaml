session:
  name: earth-luna-quic
  display_name: Earth to Luna QUIC path
  description: A QUIC client on an Earth site reaches a QUIC server on the
    lunar surface through LEO access, a LEO-to-GEO crosslink, the cislunar
    relay hop, and the lunar relay constellation. Endpoint hosts run no
    routing daemon; the FRR-routed nodes carry the path.
segments:
- id: leo
  source: nodalarc:constellations/earth/leo/earth-leo-polar-66.yaml
- id: geo_relay
  source: nodalarc:constellations/earth/geo/earth-geo-ring-8.yaml
- id: luna_relay
  source: nodalarc:constellations/luna/elfo/luna-elfo-relay-1.yaml
- id: client_ground
  placement:
    from_site_set: nodalarc:site-sets/earth/earth-quic-lab-sites.yaml
  apply:
    scheduling:
      selection_policy:
        highest_elevation: {}
      handover_policy:
        hysteresis:
          discount_factor: 1.1
          mask_fade_range_deg: 3.0
      handover_mode: mbb
      mbb_overlap_ticks: 30
      mbb_reserve: 1
      handover_concurrency: one_at_a_time
      ranking_order:
      - service_priority
      - per_gs_rank
      - satellite_ground_terminal_capacity
      - lex_pair
      mbb_preemption: 'off'
      successor_abort_policy: hard_release
      cross_tenant_displacement: 'off'
      bbm_acquire_timeout_ticks: 1
    originated_prefixes:
      ipv4:
      - default
- id: relay_ground
  placement:
    from_site_set: nodalarc:site-sets/earth/earth-quic-relay-sites.yaml
  apply:
    scheduling:
      selection_policy:
        highest_elevation: {}
      handover_policy:
        hysteresis:
          discount_factor: 1.1
          mask_fade_range_deg: 3.0
      handover_mode: mbb
      mbb_overlap_ticks: 30
      mbb_reserve: 1
      handover_concurrency: one_at_a_time
      ranking_order:
      - service_priority
      - per_gs_rank
      - satellite_ground_terminal_capacity
      - lex_pair
      mbb_preemption: 'off'
      successor_abort_policy: hard_release
      cross_tenant_displacement: 'off'
      bbm_acquire_timeout_ticks: 1
- id: luna_ground
  placement:
    from_site_set: nodalarc:site-sets/luna/luna-quic-lab-sites.yaml
  apply:
    scheduling:
      selection_policy:
        highest_elevation: {}
      handover_policy:
        hysteresis:
          discount_factor: 1.1
          mask_fade_range_deg: 3.0
      handover_mode: mbb
      mbb_overlap_ticks: 30
      mbb_reserve: 1
      handover_concurrency: one_at_a_time
      ranking_order:
      - service_priority
      - per_gs_rank
      - satellite_ground_terminal_capacity
      - lex_pair
      mbb_preemption: 'off'
      successor_abort_policy: hard_release
      cross_tenant_displacement: 'off'
      bbm_acquire_timeout_ticks: 1
link_rules:
- id: client_access
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      all:
      - segment: client_ground
      - tag: leo
    terminal:
      all:
      - role: access
      - medium: rf
    min_elevation_deg: 10
  - select:
      segment: leo
    terminal:
      all:
      - role: access
      - medium: rf
- id: relay_leo_access
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      all:
      - segment: relay_ground
      - tag: leo
    terminal:
      all:
      - role: access
      - medium: rf
    min_elevation_deg: 10
  - select:
      segment: leo
    terminal:
      all:
      - role: access
      - medium: rf
- id: relay_geo_access
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      all:
      - segment: relay_ground
      - tag: geo
    terminal:
      all:
      - role: access
      - medium: rf
      - mount: access_ka
    min_elevation_deg: 5
  - select:
      segment: geo_relay
    terminal:
      all:
      - role: access
      - medium: rf
      - mount: access_ka
- id: leo_isl
  topology:
    mode: nearest_n
    n: 4
  endpoints:
  - select:
      segment: leo
    terminal:
      all:
      - role: isl
      - medium: optical
  - select:
      segment: leo
    terminal:
      all:
      - role: isl
      - medium: optical
- id: leo_to_geo
  topology:
    mode: nearest_n
    n: 1
  endpoints:
  - select:
      segment: leo
    terminal:
      all:
      - role: crosslink
      - medium: optical
  - select:
      segment: geo_relay
    terminal:
      all:
      - role: crosslink
      - medium: optical
- id: geo_isl
  topology:
    mode: nearest_n
    n: 2
  endpoints:
  - select:
      segment: geo_relay
    terminal:
      all:
      - role: isl
      - medium: optical
  - select:
      segment: geo_relay
    terminal:
      all:
      - role: isl
      - medium: optical
- id: geo_to_luna
  topology:
    mode: nearest_n
    n: 1
  endpoints:
  - select:
      segment: geo_relay
    terminal:
      all:
      - role: crosslink
      - medium: optical
  - select:
      segment: luna_relay
    terminal:
      all:
      - role: crosslink
      - medium: optical
- id: luna_access
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      all:
      - segment: luna_ground
      - tag: luna
    terminal:
      all:
      - role: access
      - medium: rf
    min_elevation_deg: 10
  - select:
      segment: luna_relay
    terminal:
      all:
      - role: access
      - medium: rf
addressing:
  loopbacks:
  - id: node_loopbacks
    applies_to:
      any:
      - segment: leo
      - segment: geo_relay
      - segment: luna_relay
      - segment: client_ground
      - segment: relay_ground
      - segment: luna_ground
    ipv4_pool: 10.255.0.0/16
    prefix_length: 32
    allocation: by_node_order
routing:
  domains:
  - id: earth_domain
    protocol: isis
    selectors:
    - any:
      - segment: leo
      - segment: geo_relay
      - all:
        - segment: client_ground
        - tag: leo
      - segment: relay_ground
    area_assignment:
      strategy: flat
  - id: luna_domain
    protocol: isis
    selectors:
    - any:
      - segment: luna_relay
      - all:
        - segment: luna_ground
        - tag: luna
    area_assignment:
      strategy: flat
  boundaries:
  - over: geo_to_luna
    adapter: static_ip
    export:
    - from: earth_domain
      to: luna_domain
      prefixes:
        aggregate_of: originated
      export_node_loopbacks: true
      install_via: peer_loopback
    - from: luna_domain
      to: earth_domain
      prefixes:
        aggregate_of: originated
      export_node_loopbacks: true
      install_via: peer_loopback
simulation:
  candidate_limits:
    max_pairs_per_rule: 2000
    max_pairs_per_tick: 10000
time:
  start_time: '2026-06-08T00:00:00Z'
  step_seconds: 1
  compression: 1
ephemeris:
  provider: skyfield_bsp
  quality_tier: de440s
  kernels:
  - id: de440s
    path: configs/ephemerides/de440s.bsp
    sha256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
    coverage_start: '1849-12-25T00:00:00Z'
    coverage_end: '2150-01-21T00:00:00Z'
    targets:
    - nodalarc:bodies/earth.yaml
    - nodalarc:bodies/luna.yaml
    frame: gcrs
dispatch:
  latency_authority: ome
  max_latency_age_ticks: 10
