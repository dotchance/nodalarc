session:
  name: earth-mars-hdtn-relay
  display_name: Earth to Mars DTN relay chain (HDTN)
  description: 'Three Mars surface bases reach Earth through relays: UHF to two low
    relay orbiters (MRO and TGO class) and to an areostationary relay over
    105 E, X-band crosslinks between them, an optical trunk across the Earth-Mars light time (338 s
    one way at the 2027 opposition) to an Earth GEO relay, and LCRD-class
    optical links to two ground stations. Every relay and endpoint host runs
    NASA HDTN with LTP over UDP; Mars and Earth each run an IS-IS instance,
    joined by a static boundary over the trunk.'
segments:
- id: mars_relays
  source: nodalarc:space-node-sets/mars/mars-dtn-relays.yaml
- id: earth_relay
  source: nodalarc:space-node-sets/earth/geo/earth-deep-space-relay-1.yaml
- id: mars_bases
  placement:
    from_site_set: nodalarc:site-sets/mars/mars-dtn-bases.yaml
  apply:
    scheduling:
      selection_policy:
        highest_elevation: {}
      handover_policy:
        hysteresis:
          discount_factor: 1.1
          mask_fade_range_deg: 3.0
      handover_mode: mbb
      mbb_overlap_ticks: 30
      mbb_reserve: 1
      handover_concurrency: one_at_a_time
      ranking_order:
      - service_priority
      - per_gs_rank
      - satellite_ground_terminal_capacity
      - lex_pair
      mbb_preemption: 'off'
      successor_abort_policy: hard_release
      cross_tenant_displacement: 'off'
      bbm_acquire_timeout_ticks: 1
- id: earth_ogs
  placement:
    from_site_set: nodalarc:site-sets/earth/earth-mars-dtn-ogs-sites.yaml
  apply:
    # One telescope per station: a handover breaks the old link before making the new one.
    scheduling:
      selection_policy:
        highest_elevation: {}
      handover_policy:
        hard_release: {}
      handover_mode: bbm
      mbb_overlap_ticks: 0
      mbb_reserve: 0
      handover_concurrency: one_at_a_time
      ranking_order:
      - service_priority
      - per_gs_rank
      - satellite_ground_terminal_capacity
      - lex_pair
      mbb_preemption: 'off'
      successor_abort_policy: hard_release
      cross_tenant_displacement: 'off'
      bbm_acquire_timeout_ticks: 1
link_rules:
- id: mars_uhf
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      segment: mars_bases
    terminal:
      all:
      - role: access
      - medium: rf
      - mount: prox_uhf
    min_elevation_deg: 10
  - select:
      segment: mars_relays
    terminal:
      all:
      - role: access
      - medium: rf
      - mount: access_uhf
- id: mars_relay_crosslink
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      all:
      - segment: mars_relays
      - tag: lmo
    terminal:
      all:
      - role: crosslink
      - medium: rf
      - mount: relay_x
  - select:
      all:
      - segment: mars_relays
      - tag: areo
    terminal:
      all:
      - role: crosslink
      - medium: rf
      - mount: relay_x
- id: earth_mars_trunk
  topology:
    mode: nearest_n
    n: 1
  endpoints:
  - select:
      all:
      - segment: mars_relays
      - tag: areo
    terminal:
      all:
      - role: crosslink
      - medium: optical
      - mount: trunk
  - select:
      segment: earth_relay
    terminal:
      all:
      - role: crosslink
      - medium: optical
      - mount: trunk
- id: earth_optical
  topology:
    mode: visible_candidates
  endpoints:
  - select:
      segment: earth_ogs
    terminal:
      all:
      - role: access
      - medium: optical
      - mount: access_optical
    min_elevation_deg: 20
  - select:
      segment: earth_relay
    terminal:
      all:
      - role: access
      - medium: optical
      - mount: access_optical
addressing:
  loopbacks:
  - id: node_loopbacks
    applies_to:
      any:
      - segment: mars_relays
      - segment: earth_relay
      - segment: mars_bases
      - segment: earth_ogs
    ipv4_pool: 10.255.0.0/16
    prefix_length: 32
    allocation: by_node_order
routing:
  domains:
  - id: mars_domain
    protocol: isis
    selectors:
    - any:
      - segment: mars_relays
      - segment: mars_bases
    area_assignment:
      strategy: flat
  - id: earth_domain
    protocol: isis
    selectors:
    - any:
      - segment: earth_relay
      - segment: earth_ogs
    area_assignment:
      strategy: flat
  boundaries:
  - over: earth_mars_trunk
    adapter: static_ip
    export:
    - from: mars_domain
      to: earth_domain
      prefixes:
        aggregate_of: originated
      export_node_loopbacks: true
      install_via: peer_loopback
    - from: earth_domain
      to: mars_domain
      prefixes:
        aggregate_of: originated
      export_node_loopbacks: true
      install_via: peer_loopback
simulation:
  candidate_limits:
    max_pairs_per_rule: 2000
    max_pairs_per_tick: 10000
time:
  start_time: '2027-02-19T00:00:00Z'
  step_seconds: 1
  compression: 1
dispatch:
  latency_authority: ome
  max_latency_age_ticks: 10
