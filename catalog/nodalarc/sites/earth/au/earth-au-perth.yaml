site:
  id: earth-au-perth
  display_name: Perth gateway (LEO + MEO)
  verified:
    source: nodalarc_catalog
    notes: NodalArc demo site using a named-facility coordinate estimate and explicit
      emulation addressing.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/leo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 3
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2200.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 25
              max: 90
            max_tracking_rate_deg_s: 2.5
          boresight:
            mode: local_vertical
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
    interfaces:
      terr0: lan0
  - id: gw2
    display_name: MEO Gateway
    node: nodalarc:nodes/ground/meo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 500.0
            receive: 500.0
          tracking_capacity: 1
          max_range_km: 28000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 0.5
          boresight:
            mode: local_vertical
    tags:
    - meo
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: -31.9523
    lon_deg: 115.8613
    alt_m: 32
