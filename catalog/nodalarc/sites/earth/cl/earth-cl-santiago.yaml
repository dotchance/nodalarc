site:
  id: earth-cl-santiago
  display_name: Santiago teleport (LEO + GEO)
  verified:
    source: nodalarc_catalog
    notes: NodalArc demo site using a named-facility coordinate estimate and explicit
      emulation addressing. Shared teleport campus; the GEO antenna bridges the LEO
      gateway LAN to the GEO segment over terr0.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/leo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 3
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2200.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 25
              max: 90
            max_tracking_rate_deg_s: 2.5
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
  - id: gw2
    display_name: GEO Gateway
    node: nodalarc:nodes/ground/geo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 750.0
            receive: 750.0
          tracking_capacity: 1
          max_range_km: 42000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 5
              max: 90
            max_tracking_rate_deg_s: 0.1
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
    tags:
    - geo
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: -33.4489
    lon_deg: -70.6693
    alt_m: 570
