site:
  id: earth-de-frankfurt
  display_name: Frankfurt polar LEO gateway
  verified:
    source: legacy_catalog
    notes: Polar LEO demo gateway using the researched Frankfurt location and a LEO
      access terminal sized for the 780 km shell.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/leo-gateway.yaml
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2500.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 25.0
              max: 90
            max_tracking_rate_deg_s: 1.5
          boresight:
            mode: local_vertical
    payloads: {}
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 50.11
    lon_deg: 8.68
    alt_m: 110
