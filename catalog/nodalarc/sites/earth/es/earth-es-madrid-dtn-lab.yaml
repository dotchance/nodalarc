site:
  id: earth-es-madrid-dtn-lab
  display_name: Madrid DTN lab (LEO gateway + DTN endpoint host)
  verified:
    source: nodalarc_catalog
    notes: NodalArc demo site pairing a LEO gateway with a host that runs
      the Earth uD3TN endpoint.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/dtn-earth-gateway.yaml
    payloads:
      dtn:
        installed_count: 1
        tags:
        - dtn_earth
    terminals:
      access_ka:
        installed_count: 4
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2500.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 2.5
          boresight:
            mode: local_vertical
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
    interfaces:
      terr0: lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 40.45
    lon_deg: -3.6
    alt_m: 700
