site:
  id: earth-es-madrid-quic-lab
  display_name: Madrid QUIC lab (LEO gateway + client host)
  verified:
    source: nodalarc_catalog
    notes: NodalArc demo site pairing a LEO gateway with a processing host
      that runs the QUIC client endpoint.
  lan:
    ipv4: 172.16.180.0/24
    ipv6: fd00:da7a:b4::/64
  nodes:
  - id: gw1
    display_name: LEO Gateway
    model: nodalarc:nodes/ground/leo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 4
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2500.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 2.5
          boresight:
            mode: local_vertical
    originated_prefixes:
      ipv4:
      - 172.16.180.0/24
      - 0.0.0.0/0
      ipv6:
      - fd00:da7a:b4::/64
    tags:
    - leo
    interfaces:
      lo0:
        ipv4: 10.255.0.240/32
        ipv6: fd00:da7a:ffff::f0/128
      terr0:
        ipv4: 172.16.180.1/24
        ipv6: fd00:da7a:b4::1/64
  - id: quic-client
    display_name: QUIC client host
    model: nodalarc:nodes/ground/processing-host.yaml
    payloads: {}
    terminals: {}
    tags:
    - quic_client
    interfaces:
      lo0:
        ipv4: 10.255.0.241/32
        ipv6: fd00:da7a:ffff::f1/128
      terr0:
        ipv4: 172.16.180.9/24
        ipv6: fd00:da7a:b4::9/64
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 40.43
    lon_deg: -3.72
    alt_m: 700
