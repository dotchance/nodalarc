site:
  id: earth-gb-goonhilly
  display_name: Goonhilly MEO gateway
  verified:
    source: nodalarc_catalog
    notes: NodalArc MEO gateway demo site using public location coordinates and explicit
      emulation addressing.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: MEO Gateway
    node: nodalarc:nodes/ground/meo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 500.0
            receive: 500.0
          tracking_capacity: 1
          max_range_km: 28000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 0.5
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - meo
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 50.05
    lon_deg: -5.18
    alt_m: 80
