site:
  id: earth-it-fucino
  display_name: Fucino GEO gateway
  verified:
    source: nodalarc_catalog
    notes: NodalArc GEO gateway demo site using public location coordinates and explicit
      emulation addressing.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: GEO Gateway
    node: nodalarc:nodes/ground/geo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 750.0
            receive: 750.0
          tracking_capacity: 1
          max_range_km: 42000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 5
              max: 90
            max_tracking_rate_deg_s: 0.1
          boresight:
            mode: local_vertical
      tdrs_ka_sa:
        installed_count: 2
        capabilities:
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - geo
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 41.978
    lon_deg: 13.603
    alt_m: 650
