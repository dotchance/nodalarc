site:
  id: earth-sj-svalbard
  display_name: Svalbard gateway (HEO + LEO)
  verified:
    source: wikipedia
    notes: NodalArc HEO gateway demo site using the SvalSat plateau location and explicit
      emulation addressing.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: HEO Gateway
    node: nodalarc:nodes/ground/heo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 500.0
            receive: 500.0
          tracking_capacity: 1
          max_range_km: 48000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 15
              max: 90
            max_tracking_rate_deg_s: 0.8
          boresight:
            mode: local_vertical
    tags:
    - heo
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
  - id: gw2
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/leo-gateway.yaml
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2500.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 25.0
              max: 90
            max_tracking_rate_deg_s: 1.5
          boresight:
            mode: local_vertical
    payloads: {}
    tags:
    - leo
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 78.23
    lon_deg: 15.41
    alt_m: 450
