site:
  id: earth-us-hi-haleakala-dtn-ogs
  display_name: Haleakala optical ground station (OGS-2 + HDTN endpoint host)
  verified:
    source: nodalarc_catalog
    notes: 'LCRD''s OGS-2 on Haleakala (AMOS). No survey of OGS-2 was found; the
      position is the Minor Planet Center''s site 608 Haleakala-AMOS converted
      to geodetic (20.708 N, 156.258 W, about 3040 m, height within about
      60 m). LCRD''s ground stations work above 20 degrees elevation (Luzhansky et al.
      2016). Weather is not modelled.'
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: Optical ground station
    node: nodalarc:nodes/ground/earth-dtn-ogs.yaml
    payloads:
      dtn:
        installed_count: 1
        tags:
        - hdtn_haleakala
    terminals:
      access_optical:
        installed_count: 1
        capabilities:
          bandwidth_mbps:
            transmit: 1200.0
            receive: 1200.0
          tracking_capacity: 1
          max_range_km: 45000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 20
              max: 90
            max_tracking_rate_deg_s: 1.0
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - earth
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 20.708
    lon_deg: -156.258
    alt_m: 3040
