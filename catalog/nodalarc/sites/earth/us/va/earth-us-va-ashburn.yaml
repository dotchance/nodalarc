site:
  id: earth-us-va-ashburn
  display_name: Ashburn Gateway Site
  verified:
    source: legacy_catalog
    notes: Legacy operational mask was 25 degrees; operational masks belong on link-rule
      endpoints in the current grammar.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/starlink-gateway.yaml
    terminals:
      access_ka:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 1250
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 30.0
              max: 90
            max_tracking_rate_deg_s: 1.5
          boresight:
            mode: local_vertical
    payloads: {}
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: 39.04
    lon_deg: -77.49
    alt_m: 100
