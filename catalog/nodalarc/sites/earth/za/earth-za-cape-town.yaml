site:
  id: earth-za-cape-town
  display_name: Cape Town LEO B gateway
  verified:
    source: nodalarc_catalog
    notes: NodalArc demo site using a named-facility coordinate estimate and explicit
      emulation addressing.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: LEO Gateway
    node: nodalarc:nodes/ground/leo-gateway.yaml
    payloads: {}
    terminals:
      access_ka:
        installed_count: 3
        capabilities:
          bandwidth_mbps:
            transmit: 1000.0
            receive: 1000.0
          tracking_capacity: 1
          max_range_km: 2500.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 25
              max: 90
            max_tracking_rate_deg_s: 2.5
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    originated_prefixes:
      ipv4:
      - lan0
      - default
      ipv6:
      - lan0
    tags:
    - leo
  frame:
    body_fixed:
      body: nodalarc:bodies/earth.yaml
  location:
    lat_deg: -33.9249
    lon_deg: 18.4241
    alt_m: 25
