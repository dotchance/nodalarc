site:
  id: luna-artemis-quic-lab
  display_name: Artemis QUIC lab (surface gateway + server host)
  verified:
    source: nodalarc_catalog
    notes: Lunar south-pole surface site pairing the surface gateway with a processing
      host that runs the QUIC server endpoint.
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: Luna Gateway
    node: nodalarc:nodes/ground/quic-server-gateway.yaml
    payloads:
      quic-server:
        installed_count: 1
        tags:
        - quic_server
    terminals:
      access_s:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 50.0
            receive: 50.0
          tracking_capacity: 1
          max_range_km: 9000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 0.5
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - luna
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/luna.yaml
  location:
    lat_deg: -89.4
    lon_deg: 30.0
    alt_m: 0
