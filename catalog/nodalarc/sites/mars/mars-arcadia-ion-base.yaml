site:
  id: mars-arcadia-ion-base
  display_name: Arcadia Planitia base (gateway + ION endpoint host)
  verified:
    source: nodalarc_catalog
    notes: 'A candidate crewed-base region: the HiRISE target ESP_061194_2190
      (2019-08-16), imaged for Starship landing-site studies in Arcadia
      Planitia, centred at planetocentric 38.637 N, 190.154 E; converted
      here to planetodetic latitude on the catalog ellipsoid. Not an
      announced landing point. Out of view of an areostationary relay over
      105 E, it reaches the network only through low-orbiter passes.
      Height above the ellipsoid is not taken from a source and is 0.'
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: Base gateway
    node: nodalarc:nodes/ground/mars-ion-base.yaml
    payloads:
      dtn:
        installed_count: 1
        tags:
        - ion_arcadia
    terminals:
      prox_uhf:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 2.048
            receive: 2.048
          tracking_capacity: 1
          max_range_km: 25000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 2.0
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - mars
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/mars.yaml
  location:
    lat_deg: 38.9674
    lon_deg: -169.846
    alt_m: 0
