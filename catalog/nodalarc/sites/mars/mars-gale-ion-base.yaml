site:
  id: mars-gale-ion-base
  display_name: Gale base (gateway + ION endpoint host)
  verified:
    source: nodalarc_catalog
    notes: 'Curiosity''s landing site, Bradbury Landing, at its NAIF planetodetic
      coordinates (msl_v08.tf: 4.643851 S, 137.4417 E; planetocentric
      4.5895 S per the PDS Analyst''s Notebook). Height above the ellipsoid
      is not taken from a source and is 0.'
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: Base gateway
    node: nodalarc:nodes/ground/mars-ion-base.yaml
    payloads:
      dtn:
        installed_count: 1
        tags:
        - ion_gale
    terminals:
      prox_uhf:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 2.048
            receive: 2.048
          tracking_capacity: 1
          max_range_km: 25000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 2.0
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - mars
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/mars.yaml
  location:
    lat_deg: -4.643851
    lon_deg: 137.4417
    alt_m: 0
