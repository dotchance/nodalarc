site:
  id: mars-jezero-dtn-base
  display_name: Jezero base (gateway + HDTN endpoint host)
  verified:
    source: nodalarc_catalog
    notes: 'Perseverance''s landing site, Octavia E. Butler Landing, at its NAIF
      planetodetic coordinates (m2020_v04.tf: 18.64875816 N, 77.45088572 E,
      relative to IAU_MARS of pck00010; this catalog''s frame is pck00011''s).
      Height above the ellipsoid is not taken from a source and is 0.'
  ethernet:
  - id: lan0
  nodes:
  - id: gw1
    display_name: Base gateway
    node: nodalarc:nodes/ground/mars-dtn-base.yaml
    payloads:
      dtn:
        installed_count: 1
        tags:
        - hdtn_jezero
    terminals:
      prox_uhf:
        installed_count: 2
        capabilities:
          bandwidth_mbps:
            transmit: 2.048
            receive: 2.048
          tracking_capacity: 1
          max_range_km: 25000.0
          limits:
            azimuth_deg:
              min: -180
              max: 180
            elevation_deg:
              min: 10
              max: 90
            max_tracking_rate_deg_s: 2.0
          boresight:
            mode: local_vertical
    interfaces:
      terr0: lan0
    tags:
    - mars
    originated_prefixes:
      ipv4:
      - lan0
      ipv6:
      - lan0
  frame:
    body_fixed:
      body: nodalarc:bodies/mars.yaml
  location:
    lat_deg: 18.64875816
    lon_deg: 77.45088572
    alt_m: 0
