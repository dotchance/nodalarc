terminal:
  id: optical-mars-trunk
  display_name: Mars-to-Earth optical trunk terminal
  medium: optical
  signal:
    wavelength_nm: 1550
  bandwidth_mbps:
    transmit: 1
    receive: 1
  tracking_capacity: 1
  max_range_km: 405000000
  limits:
    azimuth_deg:
      min: -180
      max: 180
    elevation_deg:
      min: -90
      max: 90
    max_tracking_rate_deg_s: 0.25
  reference: https://www.militaryaerospace.com/communications/news/55361810/nasa-outlines-requirements-for-high-performance-mars-telecommunications-network-spacecraft
  notes: 'Trunk between a Mars relay and an Earth relay, both ends one terminal
    type: the runtime pairs a crosslink only between terminals of one type, so
    the trunk carries one rate both ways. The rate is NASA''s Mars
    Telecommunications Network requirement for the return link to Earth: at
    least 1 Mbps at the maximum Mars-Earth range of about 400 million km. The
    requirement''s forward link is 0.1 Mbps, ten times lower, so the forward
    rate here is overstated. The terminal rate does not follow range, so the
    trunk carries 1 Mbps at every distance, also near opposition where a real
    link closes faster. 1550 nm is the downlink wavelength of NASA''s Deep
    Space Optical Communications demonstration. Range covers the largest
    Earth-Mars separation in the shipped data (400.2 million km).'
