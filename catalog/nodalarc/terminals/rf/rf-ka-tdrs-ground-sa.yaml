terminal:
  id: rf-ka-tdrs-ground-sa
  display_name: TDRS ground Ka-band single-access terminal
  medium: rf
  signal:
    band: ka
    frequency_hz: 26000000000
  bandwidth_mbps:
    transmit: 600
    receive: 50
  tracking_capacity: 1
  max_range_km: 45000
  limits:
    azimuth_deg:
      min: -180
      max: 180
    elevation_deg:
      min: 0
      max: 90
    max_tracking_rate_deg_s: 0.1
  reference: https://www.eoportal.org/satellite-missions/tdrs
  notes: Reciprocal ground terminal for the TDRS relay Ka-band single-access mount.
