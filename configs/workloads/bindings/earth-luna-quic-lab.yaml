# The heterogeneous binding for the earth-luna-quic example session: the
# tagged endpoint hosts run the QUIC client and server profiles; every
# routed node runs the built-in FRR-plus-observer profile. One sky, three
# kinds of node.
implementation_binding:
  schema_version: "1"
  id: earth-luna-quic-lab
  description: QUIC client and server hosts with FRR routing everywhere else.
  entries:
  - id: client
    selector: {tag: quic_client}
    profile: nodalarc:profiles/quic/picoquic-client.yaml
  - id: server
    selector: {tag: quic_server}
    profile: nodalarc:profiles/quic/picoquic-server.yaml
  - id: routers
    selector: {remainder: true}
    profile: nodalarc:profiles/frr/frr-observer.yaml
