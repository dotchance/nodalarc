# One remainder entry: every resolved node runs the complete FRR-plus-observer
# profile. The first shipped explicit selection.
implementation_binding:
  schema_version: "1"
  id: frr-observer-everywhere
  description: Bind every resolved node to the built-in FRR-plus-observer profile.
  entries:
  - id: everything
    selector: {remainder: true}
    profile: nodalarc:profiles/frr/frr-observer.yaml
