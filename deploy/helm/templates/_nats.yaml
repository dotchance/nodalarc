{{/* NATS helpers shared by every workload template.

     nodalarc.nats-messaging: the deployed-stream inventory
     the chart assembly rendered into files/nats-messaging.yaml from
     lib/nodalarc/nats_channels.py. Fails closed: a missing, empty,
     malformed or incomplete inventory fails the render.

     nodalarc.nats-url: the one NATS URL every workload dials, from the NATS
     Service name and the client port. Host-network workloads dial it too:
     kube-proxy answers a ClusterIP connection made from a server's own
     network namespace. Callers pass the root context. */}}
{{- define "nodalarc.nats-messaging" -}}
{{- $raw := .Files.Get "files/nats-messaging.yaml" -}}
{{- if not $raw }}{{ fail "files/nats-messaging.yaml is missing or empty: assemble the chart through scripts/na-render-helm-chart.sh" }}{{ end -}}
{{- $messaging := fromYaml $raw -}}
{{- if hasKey $messaging "Error" }}{{ fail (printf "files/nats-messaging.yaml is malformed: %s" (get $messaging "Error")) }}{{ end -}}
{{- if not $messaging.streams }}{{ fail "files/nats-messaging.yaml declares no streams" }}{{ end -}}
{{- if not (kindIs "slice" $messaging.streams) }}{{ fail "files/nats-messaging.yaml: streams must be a list" }}{{ end -}}
{{- range $messaging.streams -}}
{{- if not (kindIs "map" .) }}{{ fail "files/nats-messaging.yaml: every stream must be a mapping" }}{{ end -}}
{{- if or (not (kindIs "string" .name)) (not (regexMatch "^NODALARC_[A-Z]+$" (.name | toString))) }}{{ fail (printf "files/nats-messaging.yaml: stream name %v is not a NODALARC_* name" .name) }}{{ end -}}
{{- if or (not (kindIs "string" .subjects)) (not (regexMatch "^nodalarc\\.[a-z_]+\\.>$" (.subjects | toString))) }}{{ fail (printf "files/nats-messaging.yaml: stream %s subject pattern %v is not a root wildcard" .name .subjects) }}{{ end -}}
{{- end -}}
{{- $raw -}}
{{- end -}}

{{- define "nodalarc.nats-url" -}}
nats://nodalarc-nats:{{ .Values.nats.clientPort }}
{{- end -}}
