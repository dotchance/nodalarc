{{- $orchestratorClusterName := printf "nodalarc-orchestrator-cluster-%s-%s" .Release.Name .Values.namespace }}
{{- $orchestratorClusterBindingName := printf "%s-binding" $orchestratorClusterName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodalarc-orchestrator
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodalarc-orchestrator
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # Scheduler gates startup on substrate status ConfigMaps selected by label.
    verbs: ["get", "list"]
  - apiGroups: ["nodalarc.io"]
    resources: ["constellationspecs"]
    verbs: ["get", "list", "watch"]
  # Note: nodes is cluster-scoped — see ClusterRole below
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodalarc-orchestrator
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodalarc-orchestrator
subjects:
  - kind: ServiceAccount
    name: nodalarc-orchestrator
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodalarc-vs-api
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodalarc-vs-api
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["nodalarc-terminal-keys"]
    verbs: ["get"]
  - apiGroups: ["nodalarc.io"]
    resources: ["constellationspecs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["nodalarc.io"]
    resources: ["constellationspecs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodalarc-vs-api
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodalarc-vs-api
subjects:
  - kind: ServiceAccount
    name: nodalarc-vs-api
    namespace: {{ .Values.namespace }}
---
# ClusterRole for cluster-scoped resources (nodes)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $orchestratorClusterName | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    nodalarc.io/managed-by: helm
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $orchestratorClusterBindingName | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    nodalarc.io/managed-by: helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $orchestratorClusterName | quote }}
subjects:
  - kind: ServiceAccount
    name: nodalarc-orchestrator
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: nodalarc-vs-api
    namespace: {{ .Values.namespace }}
