# NATS server configuration — JetStream with file-based storage.
# Streams are persistent across NATS restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodalarc-nats-config
  namespace: {{ .Values.namespace }}
  labels:
    app: nodalarc-nats
data:
  nats.conf: |
    listen: 0.0.0.0:4222
    http_port: 8222
    max_payload: 8MB
{{- if .Values.nats.auth.enabled }}
{{- $messaging := fromYaml (include "nodalarc.nats-messaging" .) }}

    authorization {
      users = [
{{- $last := sub (len $messaging.users) 1 }}
{{- range $i, $user := $messaging.users }}
{{- $account := index $.Values.nats.auth.users $user.key | required (printf "nats.auth.users.%s is required" $user.key) }}
        {
          user: {{ $account.username | quote }}
          password: {{ $account.password | quote }}
          permissions: {
            publish: [{{ range $j, $p := $user.publish }}{{ if $j }}, {{ end }}{{ $p | quote }}{{ end }}],
            subscribe: [{{ range $j, $p := $user.subscribe }}{{ if $j }}, {{ end }}{{ $p | quote }}{{ end }}]
          }
        }{{ if lt $i $last }},{{ end }}
{{- end }}
      ]
    }
{{- end }}

    jetstream {
      store_dir: /data/jetstream
      max_mem: 256MB
      max_file: 2GB
    }
