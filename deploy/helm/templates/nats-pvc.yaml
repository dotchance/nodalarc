# PersistentVolumeClaim for NATS JetStream file storage.
# Streams survive NATS pod restarts. With nats.storageClass empty the
# cluster's default StorageClass provisions the volume; a cluster without a
# default (RKE2, kubeadm) names one in values.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nodalarc-nats-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-nats
spec:
  accessModes:
    - ReadWriteOnce
{{- with .Values.nats.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.nats.storageSize | default "2Gi" }}
