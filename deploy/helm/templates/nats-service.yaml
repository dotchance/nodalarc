# NATS ClusterIP Service; every workload connects through NODALARC_NATS_URL, rendered from nats.clientPort.
apiVersion: v1
kind: Service
metadata:
  name: nodalarc-nats
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-nats
spec:
  selector:
    app: nodalarc-nats
  ports:
    - name: client
      port: {{ .Values.nats.clientPort }}
      targetPort: 4222
      protocol: TCP
    - name: monitoring
      port: 8222
      targetPort: 8222
      protocol: TCP
