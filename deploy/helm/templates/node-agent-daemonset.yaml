apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Values.namespace }}
  labels:
    app: nodalarc-node-agent
spec:
  selector:
    matchLabels:
      app: nodalarc-node-agent
  template:
    metadata:
      labels:
        app: nodalarc-node-agent
        nodalarc.io/role: node-agent
      annotations:
        checksum/platform-config: {{ tpl (.Files.Get "files/platform.yaml") . | sha256sum | quote }}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: nodalarc-node-agent
      nodeSelector:
        nodalarc.io/node-agent: "true"
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - operator: Exists
      initContainers:
        {{- include "nodalarc.nats-wait-init" (dict "Values" .Values "Files" .Files "hostNetwork" true) | nindent 8 }}
      containers:
        - name: node-agent
          image: {{ required "images.nodeAgent is required" .Values.images.nodeAgent | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            privileged: true
          args:
            - "--platform-config"
            - "/etc/nodalarc/platform.yaml"
          env:
            - name: NODAL_BUILD
              value: {{ .Values.buildTag | quote }}
            - name: NODALARC_NATS_URL
              value: {{ include "nodalarc.nats-url" (dict "Values" .Values "user" "nodeAgent" "hostNetwork" true) | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: unix:///run/k3s/containerd/containerd.sock
            - name: NODE_AGENT_OPS_SPOOL
              value: /var/lib/nodalarc/node-agent/ops-events.jsonl
            - name: KUBELET_PODS_DIR
              value: /var/lib/kubelet/pods
          resources:
            limits:
              memory: {{ .Values.nodeAgent.memoryLimit | default "256Mi" }}
              cpu: {{ .Values.nodeAgent.cpuLimit | default "500m" }}
          volumeMounts:
            - name: platform-config
              mountPath: /etc/nodalarc/platform.yaml
              subPath: platform.yaml
            # The runtime's directory, not its socket file: a runtime restart
            # replaces the socket, and a bind mount of the file keeps the
            # deleted one, cutting the Node Agent off from CRI until its pod
            # is replaced.
            - name: containerd-run
              mountPath: /run/k3s/containerd
              readOnly: true
            - name: node-agent-spool
              mountPath: /var/lib/nodalarc/node-agent
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
            # The Node Agent writes each session pod's wiring proof into the
            # pod's wiring-status emptyDir here. Host-to-container propagation
            # lets the kubelet's unmounts of other pods' volumes reach this
            # mount namespace, so it never holds a copy of them.
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: HostToContainer
      volumes:
        - name: platform-config
          configMap:
            name: nodalarc-platform-config
        - name: containerd-run
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: node-agent-spool
          hostPath:
            path: /var/lib/nodalarc/node-agent
            type: DirectoryOrCreate
        - name: host-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
