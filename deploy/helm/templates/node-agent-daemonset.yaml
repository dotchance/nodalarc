apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-node-agent
spec:
  selector:
    matchLabels:
      app: nodalarc-node-agent
  template:
    metadata:
      labels:
        app: nodalarc-node-agent
        nodalarc.io/role: node-agent
      annotations:
        checksum/platform-config: {{ tpl (.Files.Get "files/platform.yaml") . | sha256sum | quote }}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: nodalarc-node-agent
{{- with .Values.placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
{{- end }}
      securityContext:
        seccompProfile:
          type: Unconfined
{{- with .Values.placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
      initContainers:
        {{- include "nodalarc.nats-wait-init" . | nindent 8 }}
      containers:
        - name: node-agent
          image: {{ required "images.nodeAgent is required" .Values.images.nodeAgent | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            privileged: true
          args:
            - "--platform-config"
            - "/etc/nodalarc/platform.yaml"
          env:
            - name: NODAL_BUILD
              value: {{ .Values.buildTag | quote }}
            - name: NODALARC_NATS_URL
              value: {{ include "nodalarc.nats-url" (dict "Values" .Values "user" "nodeAgent") | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_AGENT_OPS_SPOOL
              value: /var/lib/nodalarc/node-agent/ops-events.jsonl
          # Ready only while this server passes node qualification. Every
          # probe runs the checks, so readiness follows the server's current
          # state; a failed probe's message lists each check.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  exec python -m node_agent.qualification
                  --host-ip "$HOST_IP"
                  --link-mtu {{ required "network.linkMtu is required" .Values.network.linkMtu | int }}
                  --vxlan-port {{ required "network.vxlanPort is required" .Values.network.vxlanPort | int }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: {{ .Values.nodeAgent.memoryLimit | default "256Mi" }}
              cpu: {{ .Values.nodeAgent.cpuLimit | default "500m" }}
          volumeMounts:
            - name: platform-config
              mountPath: /etc/nodalarc/platform.yaml
              subPath: platform.yaml
            - name: node-agent-spool
              mountPath: /var/lib/nodalarc/node-agent
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
            # The site-LAN namespace is pinned here by a bind mount the Node
            # Agent makes; Bidirectional propagation puts the mount on the
            # server, so the namespace outlives the Node Agent's container.
            - name: host-netns
              mountPath: /run/netns
              mountPropagation: Bidirectional
      volumes:
        - name: platform-config
          configMap:
            name: nodalarc-platform-config
        - name: node-agent-spool
          hostPath:
            path: /var/lib/nodalarc/node-agent
            type: DirectoryOrCreate
        - name: host-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: host-netns
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
