apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Release.Namespace }}
rules:
  # patch: the Node Agent writes each wired pod's wiring proof onto that pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The Scheduler writer Lease, read only: its transition count is the lowest
  # writer epoch the Node Agent accepts. The Node Agent lists and watches it by
  # name (a metadata.name field selector), which resourceNames authorizes.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["nodalarc-scheduler-writer"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodalarc-node-agent
subjects:
  - kind: ServiceAccount
    name: nodalarc-node-agent
    namespace: {{ .Release.Namespace }}
