apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Values.namespace }}
rules:
  # patch: the Node Agent writes each wired pod's wiring proof onto that pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nodalarc-node-agent
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nodalarc-node-agent
subjects:
  - kind: ServiceAccount
    name: nodalarc-node-agent
    namespace: {{ .Values.namespace }}
