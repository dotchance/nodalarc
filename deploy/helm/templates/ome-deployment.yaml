apiVersion: apps/v1
kind: Deployment
metadata:
  name: ome
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-ome
spec:
  replicas: 1
  # A pod serves one session run. Recreate removes the old pod before the new
  # one starts, so two instances never serve a session together.
  strategy:
    type: Recreate
    # Clears the RollingUpdate parameters a Deployment created before this
    # strategy carries; the API refuses them alongside Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      app: nodalarc-ome
  template:
    metadata:
      labels:
        app: nodalarc-ome
      annotations:
        checksum/platform-config: {{ tpl (.Files.Get "files/platform.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: nodalarc-ome
{{- if .Values.controlPlaneNode }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.controlPlaneNode }}
{{- end }}
      initContainers:
        - name: ensure-nats-streams
          image: {{ required "images.natsBox is required" .Values.images.natsBox | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c"]
          # The shell is the container's PID 1, which the kernel does not signal
          # unless it handles the signal: the work runs as its child, and SIGTERM
          # ends the container at once. A new pod's first connections can be
          # refused until the network policy admits its address, so the check
          # repeats often.
          args:
            - |
              trap 'exit 143' TERM
              {
              set -e
              echo "Waiting for NATS..."
{{- $messaging := fromYaml (include "nodalarc.nats-messaging" .) }}
{{- $streamNames := list }}
{{- range $messaging.streams }}{{ $streamNames = append $streamNames .name }}{{ end }}
{{- if not (kindIs "map" .Values.nats.streamRetention) }}{{ fail "nats.streamRetention is missing: this release predates the retention table; run make upgrade (which carries the chart values) before make deploy-<service>, which reuses the release's values" }}{{ end }}
{{- range $name, $entry := .Values.nats.streamRetention }}
{{- if not (has $name $streamNames) }}{{ fail (printf "nats.streamRetention.%s names no deployed stream" $name) }}{{ end }}
{{- if not (kindIs "map" $entry) }}{{ fail (printf "nats.streamRetention.%s must be a mapping" $name) }}{{ end }}
{{- range $field := list "maxMsgsPerSubject" "maxBytes" }}
{{- $value := index $entry $field }}
{{- if not (or (kindIs "int64" $value) (kindIs "int" $value) (kindIs "float64" $value)) }}{{ fail (printf "nats.streamRetention.%s.%s must be an integer, got %v" $name $field $value) }}{{ end }}
{{- if ne (printf "%v" ($value | float64)) (printf "%v" ($value | int64 | float64)) }}{{ fail (printf "nats.streamRetention.%s.%s must be an integer, got %v" $name $field $value) }}{{ end }}
{{- end }}
{{- if or (not (kindIs "string" $entry.maxAge)) (not (regexMatch "^([0-9]+(ns|us|ms|s|m|h))+$" ($entry.maxAge | toString))) }}{{ fail (printf "nats.streamRetention.%s.maxAge must be a duration such as 3h12m, got %v" $name $entry.maxAge) }}{{ end }}
{{- end }}
              NATS_URL={{ include "nodalarc.nats-url" (dict "Values" .Values "user" "admin") | quote }}
              until nats server check connection -s "$NATS_URL" 2>/dev/null; do
                sleep 0.25
              done
              echo "NATS ready. Creating streams..."
{{- range $messaging.streams }}
{{- $retention := index $.Values.nats.streamRetention .name | required (printf "nats.streamRetention.%s is required" .name) }}
              nats stream add {{ .name }} \
                --server="$NATS_URL" \
                --subjects={{ .subjects | quote }} \
                --storage=file --retention=limits \
                --max-msgs-per-subject={{ $retention.maxMsgsPerSubject | int64 }} \
                --max-age={{ $retention.maxAge }} \
                --max-bytes={{ $retention.maxBytes | int64 }} \
                --defaults
{{- end }}
              echo "Streams ready."
              } &
              wait $!
      containers:
        - name: ome
          image: {{ required "images.ome is required" .Values.images.ome | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: NODAL_BUILD
              value: {{ .Values.buildTag | quote }}
            - name: NODALARC_RELEASE
              value: {{ required "runtimeRelease is required" .Values.runtimeRelease | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODALARC_NATS_URL
              value: {{ include "nodalarc.nats-url" (dict "Values" .Values "user" "service") | quote }}
          args:
            - "--continuous"
            - "--platform-config"
            - "/etc/nodalarc/platform.yaml"
            - "--session-config-dir"
            - "/etc/nodalarc/session-config"
            - "--installed-shipped-root"
            - "/app/catalog/nodalarc"
            - "/etc/nodalarc/session-config/session.yaml"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          # The Operator declares a session Ready only after this probe passes,
          # so the probe runs every second. The health responder shares the GIL
          # with the physics loop; checkpoint-recovery replay can stall it past
          # the k8s default 1s timeout even though the process is healthy and
          # working, and 15 consecutive failures keep the 15 s tolerance a
          # 5 s period with the default threshold gave.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
            # Default 1s timeout killed a LIVE OME mid-replay, forcing an
            # ever-longer replay each restart. A real hang still fails six
            # consecutive 5s probes.
            timeoutSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.ome.cpuRequest | default "500m" }}
              memory: {{ .Values.ome.memoryRequest | default "512Mi" }}
            limits:
              cpu: {{ .Values.ome.cpuLimit | default "2000m" }}
              memory: {{ .Values.ome.memoryLimit | default "1Gi" }}
          volumeMounts:
            - name: session-config
              mountPath: /etc/nodalarc/session-config
            - name: constellation-config
              mountPath: /etc/nodalarc/constellation.yaml
              subPath: constellation.yaml
            - name: ground-stations
              mountPath: /etc/nodalarc/ground-stations.yaml
              subPath: ground-stations.yaml
            - name: platform-config
              mountPath: /etc/nodalarc/platform.yaml
              subPath: platform.yaml
      volumes:
        - name: session-config
          configMap:
            name: nodalarc-session
            optional: true
        - name: platform-config
          configMap:
            name: nodalarc-platform-config
        - name: constellation-config
          configMap:
            name: nodalarc-constellation
            optional: true
        - name: ground-stations
          configMap:
            name: nodalarc-ground-stations
            optional: true
