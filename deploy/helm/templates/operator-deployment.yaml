apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodalarc-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-operator
spec:
  replicas: 1
  strategy:
    # One Operator instance at a time: the old pod is gone before the new one
    # starts, so two instances never reconcile the same ConstellationSpec.
    type: Recreate
  selector:
    matchLabels:
      app: nodalarc-operator
  template:
    metadata:
      labels:
        app: nodalarc-operator
      annotations:
        checksum/platform-config: {{ tpl (.Files.Get "files/platform.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: nodalarc-operator
{{- if .Values.controlPlaneNode }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.controlPlaneNode }}
{{- end }}
      containers:
        - name: operator
          image: {{ required "images.operator is required" .Values.images.operator | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - "--namespace"
            - {{ .Release.Namespace | quote }}
            - "--liveness=http://0.0.0.0:8090/healthz"
          env:
            - name: NODAL_BUILD
              value: {{ .Values.buildTag | quote }}
            - name: NODALARC_RELEASE
              value: {{ required "runtimeRelease is required" .Values.runtimeRelease | quote }}
            - name: NODALARC_NATS_URL
              value: {{ include "nodalarc.nats-url" . | quote }}
            - name: WIRING_GATE_IMAGE
              value: {{ required "images.base is required" .Values.images.base | quote }}
{{- if .Values.workloadDevImageOverrides }}
            # Explicit, visibly non-reproducible development substitution of
            # workload profile images. Never set in production installs.
            - name: WORKLOAD_DEV_IMAGE_OVERRIDES
              value: {{ .Values.workloadDevImageOverrides | quote }}
{{- end }}
            - name: IMAGE_PULL_POLICY
              value: {{ .Values.imagePullPolicy | quote }}
            # The tolerations every session pod carries: the same list the
            # Node Agent DaemonSet uses, so a tainted dedicated pool admits both.
            - name: SESSION_POD_TOLERATIONS
              value: {{ required "placement.tolerations is required" .Values.placement.tolerations | toJson | quote }}
          ports:
            - containerPort: 8090
              name: health
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 4Gi
              cpu: "16"
          volumeMounts:
            - name: platform-config
              mountPath: /etc/nodalarc/platform.yaml
              subPath: platform.yaml
      volumes:
        - name: platform-config
          configMap:
            name: nodalarc-platform-config
