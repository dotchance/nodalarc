apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodalarc-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-scheduler
spec:
  replicas: 1
  # A pod serves one session run. Recreate removes the old pod before the new
  # one starts, so two instances never serve a session together.
  strategy:
    type: Recreate
    # Clears the RollingUpdate parameters a Deployment created before this
    # strategy carries; the API refuses them alongside Recreate.
    rollingUpdate: null
  selector:
    matchLabels:
      app: nodalarc-scheduler
  template:
    metadata:
      labels:
        app: nodalarc-scheduler
      annotations:
        checksum/platform-config: {{ tpl (.Files.Get "files/platform.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: nodalarc-orchestrator
{{- if .Values.controlPlaneNode }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.controlPlaneNode }}
{{- end }}
      initContainers:
        {{- include "nodalarc.nats-wait-init" . | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ required "images.scheduler is required" .Values.images.scheduler | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: NODAL_BUILD
              value: {{ .Values.buildTag | quote }}
            - name: NODALARC_RELEASE
              value: {{ required "runtimeRelease is required" .Values.runtimeRelease | quote }}
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODALARC_NATS_URL
              value: {{ include "nodalarc.nats-url" (dict "Values" .Values "user" "scheduler") | quote }}
          args:
            - "--session"
            - "/etc/nodalarc/session-config/session.yaml"
            - "--session-config-dir"
            - "/etc/nodalarc/session-config"
            - "--installed-shipped-root"
            - "/app/catalog/nodalarc"
            - "--platform-config"
            - "/etc/nodalarc/platform.yaml"
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          # The Operator declares a session Ready only after this probe passes,
          # so the probe runs every second; 15 consecutive failures keep the
          # 15 s tolerance a 5 s period with the default threshold gave.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: {{ .Values.scheduler.memoryLimit | default "512Mi" }}
              cpu: {{ .Values.scheduler.cpuLimit | default "500m" }}
          volumeMounts:
            - name: session-config
              mountPath: /etc/nodalarc/session-config
            - name: platform-config
              mountPath: /etc/nodalarc/platform.yaml
              subPath: platform.yaml
            - name: constellation-config
              mountPath: /etc/nodalarc/constellation.yaml
              subPath: constellation.yaml
            - name: ground-stations
              mountPath: /etc/nodalarc/ground-stations.yaml
              subPath: ground-stations.yaml
      volumes:
        - name: session-config
          configMap:
            name: nodalarc-session
            optional: true
        - name: platform-config
          configMap:
            name: nodalarc-platform-config
        - name: constellation-config
          configMap:
            name: nodalarc-constellation
            optional: true
        - name: ground-stations
          configMap:
            name: nodalarc-ground-stations
            optional: true
