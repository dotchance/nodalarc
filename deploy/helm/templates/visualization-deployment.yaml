apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodalarc-vf
  namespace: {{ .Release.Namespace }}
  labels:
    app: nodalarc-vf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nodalarc-vf
  template:
    metadata:
      labels:
        app: nodalarc-vf
    spec:
{{- if .Values.controlPlaneNode }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.controlPlaneNode }}
{{- end }}
{{- if not .Values.vf.vsApiUrl }}
      # The page calls VS-API on its own server at port 8080
      # (frontend/src/config.ts), so the page runs on the server that runs
      # VS-API, on a cluster of any size.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nodalarc-vs-api
              topologyKey: kubernetes.io/hostname
{{- end }}
      containers:
        - name: vf
          image: {{ required "images.vf is required" .Values.images.vf | quote }}
          imagePullPolicy: {{ include "nodalarc.image-pull-policy" (dict "image" .Values.images.vf "policy" .Values.imagePullPolicy) }}
{{- if or .Values.vf.vsApiUrl .Values.vf.wsUrl }}
{{- if not (and .Values.vf.vsApiUrl .Values.vf.wsUrl) }}
{{- fail "vf.vsApiUrl and vf.wsUrl must be set together: one URL rewritten without the other leaves the browser dialing the wrong origin for the missing half" }}
{{- end }}
          env:
            - name: VS_API_URL
              value: {{ .Values.vf.vsApiUrl | quote }}
            - name: WS_URL
              value: {{ .Values.vf.wsUrl | quote }}
{{- end }}
          ports:
            - containerPort: 80
              hostPort: 3000
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: {{ .Values.vf.memoryLimit | default "128Mi" }}
              cpu: {{ .Values.vf.cpuLimit | default "100m" }}
---
apiVersion: v1
kind: Service
metadata:
  name: nodalarc-vf
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: nodalarc-vf
  ports:
    - port: 80
      targetPort: 80
      name: http
