# Default values for Nodal Arc deployment

# JSON map of profile image references to replacement references, applied to
# composed workload containers with loud logging. Development only; empty in
# production so digest admission is never weakened.
workloadDevImageOverrides: ""

images:
  base: nodalarc/base:dev
  ome: nodalarc/ome:dev
  vf: nodalarc/vf:dev
  scheduler: nodalarc/scheduler:dev
  nodeAgent: nodalarc/node-agent:dev
  vsApi: nodalarc/vs-api:dev
  operator: nodalarc/operator:dev

buildTag: "dev"
# Pull policy for every image. Published images are pulled once per server.
# The development lifecycle scripts pass their own value: Never on a
# single-server cluster whose images are imported into containerd, Always
# when a registry serves content-tagged development images.
imagePullPolicy: IfNotPresent

# Resource strategy: requests are minimum guaranteed, limits are burst ceiling.
# Requests must fit on the node; limits can exceed node capacity (burstable QoS).

ome:
  cpuRequest: 500m
  cpuLimit: "16"
  memoryRequest: 512Mi
  memoryLimit: 16Gi

# VF: containerized React SPA served by nginx
vf:
  memoryLimit: 1Gi
  cpuLimit: "4"
  # Browser-facing VS-API endpoints, written into the VF container's
  # config.js at start. Set both together when a TLS front (deploy/Caddyfile)
  # carries the traffic; empty means the browser auto-derives
  # http://<page-host>:8080 and ws://<page-host>:8080/ws/v1/state.
  vsApiUrl: ""  # e.g. https://nodal.example.com
  wsUrl: ""     # e.g. wss://nodal.example.com/ws/v1/state

# Scheduler consumes OME events and dispatches topology changes to Node Agents.
scheduler:
  memoryLimit: 4Gi
  cpuLimit: "16"

# Node Agent DaemonSet runs on each K3s node.
# Executes privileged netlink operations on behalf of the Scheduler.
nodeAgent:
  memoryLimit: 4Gi
  cpuLimit: "8"
  # Whether the Node Agent loads the kernel modules a session needs (MPLS) on
  # its host when the session is wired. Set false where the platform team
  # forbids module loads; the host's own configuration must then load them.
  loadKernelModules: true
  # The kubelet's root directory on the hosts (its --root-dir). k0s uses
  # /var/lib/k0s/kubelet; MicroK8s uses /var/snap/microk8s/common/var/lib/kubelet.
  kubeletRootDir: /var/lib/kubelet

# Where NodalArc runs. With both empty the Node Agent runs on every server
# the scheduler admits, and a server that fails node qualification simply
# stays unready. A dedicated pool is selected with nodeSelector; a tainted
# pool needs the matching tolerations, which the Node Agent and every
# session pod carry alike.
placement:
  nodeSelector: {}
  tolerations: []

# Emulated network settings, chosen at install.
network:
  # MTU of every emulated interface. Hosts must carry this plus 50 bytes
  # (70 over IPv6 node addresses) between each other.
  linkMtu: 8800
  # UDP port of NodalArc's VXLAN tunnels between hosts: free on every host,
  # open between them, outside the ephemeral and NodePort ranges.
  vxlanPort: 14789

# VS-API: FastAPI server for visualization state
vsApi:
  memoryLimit: 2Gi
  cpuLimit: "8"
  # Session data (user catalog, builder-saved sessions, session history).
  # Empty: the cluster's default StorageClass. A cluster without a default
  # (RKE2, kubeadm) names one here.
  storageClass: ""
  storageSize: 2Gi

# NATS JetStream messaging server
nats:
  replicas: 1
  clientPort: 4222
  # Retention per deployed stream, keyed by the stream name the registry
  # declares (lib/nodalarc/nats_channels.py). The stream names and subject
  # patterns themselves are rendered into the chart at assembly time; a
  # stream without retention here, or retention naming no stream, fails
  # the render.
  streamRetention:
    NODALARC_OME:
      maxMsgsPerSubject: -1
      maxAge: "3h12m"
      maxBytes: 134217728
    NODALARC_LINKS:
      maxMsgsPerSubject: 1
      maxAge: "3h12m"
      maxBytes: 67108864
    NODALARC_SESSION:
      maxMsgsPerSubject: 1
      maxAge: "3h12m"
      maxBytes: 67108864
    NODALARC_OPS:
      maxMsgsPerSubject: -1
      maxAge: "4h"
      maxBytes: 134217728
    NODALARC_DEBUG:
      maxMsgsPerSubject: 500
      maxAge: "5m"
      maxBytes: 67108864
  memoryLimit: 2Gi
  memoryRequest: 256Mi
  cpuLimit: "8"
  cpuRequest: 250m
  auth:
    enabled: false
    users:
      admin:
        username: nodalarc-admin
        password: nodalarc-admin-dev
      scheduler:
        username: nodalarc-scheduler
        password: nodalarc-scheduler-dev
      nodeAgent:
        username: nodalarc-node-agent
        password: nodalarc-node-agent-dev
      service:
        username: nodalarc-service
        password: nodalarc-service-dev
  # JetStream storage. Empty: the cluster's default StorageClass. A cluster
  # without a default (RKE2, kubeadm) names one here.
  storageClass: ""
  storageSize: "4Gi"

# Node for platform pods (auto-detected if empty, or set to your node name).
controlPlaneNode: ""
