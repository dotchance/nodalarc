syntax = "proto3";

package nodalarc.node_agent;

// The Node Agent runs as a DaemonSet on each K3s node. It executes
// privileged netlink operations against local pod namespaces. The Scheduler
// sends these protobuf payloads over NATS request/reply; this file intentionally
// declares messages only, not a gRPC service.

message CommandEnvelope {
  string operation_id = 1;
  string session_id = 2;
  string wiring_generation = 3;
  string operation_kind = 4;
  // The sending Scheduler's writer epoch: the transition count of the
  // session writer lease it holds. A Node Agent refuses a command whose
  // epoch is below the highest it has accepted for the same session and
  // wiring generation. Zero is not an epoch.
  uint64 writer_epoch = 5;
}

enum NodeAgentErrorCode {
  NODE_AGENT_ERROR_UNSPECIFIED = 0;
  NODE_AGENT_OK = 1;
  NODE_AGENT_MALFORMED_FRAME = 2;
  NODE_AGENT_UNKNOWN_MESSAGE_TYPE = 3;
  NODE_AGENT_BAD_PROTOBUF = 4;
  NODE_AGENT_INVALID_ENVELOPE = 5;
  NODE_AGENT_STALE_SESSION = 6;
  NODE_AGENT_STALE_GENERATION = 7;
  NODE_AGENT_INVALID_FIELD = 8;
  NODE_AGENT_PID_NOT_FOUND = 9;
  NODE_AGENT_KERNEL_MUTATION_FAILED = 10;
  NODE_AGENT_KERNEL_PROOF_FAILED = 11;
  NODE_AGENT_CLEANUP_FAILED = 12;
  NODE_AGENT_HOST_IP_MISSING = 13;
  NODE_AGENT_DIRTY_KERNEL = 14;
  NODE_AGENT_INTERNAL_ERROR = 15;
  NODE_AGENT_UNAUTHORIZED = 16;
  NODE_AGENT_DEPENDENCY_MISSING = 17;
  NODE_AGENT_MANIFEST_INVALID = 18;
  NODE_AGENT_STALE_WRITER = 19;
}

enum LinkType {
  LINK_TYPE_UNSPECIFIED = 0;
  LINK_TYPE_ISL = 1;
  LINK_TYPE_GROUND = 2;
}

// Per-interface locality — carried in each InterfaceUp/InterfaceDown entry,
// not on the batch request. The Node Agent decides per-interface whether to
// use local veth or VXLAN.
enum Locality {
  LOCALITY_UNSPECIFIED = 0;
  LOCALITY_LOCAL = 1;        // Both pods on this node — direct veth operations
  LOCALITY_CROSS_NODE = 2;   // Pods on different nodes — VXLAN tunnel
}

// What a BatchLinkDown entry does to its end of a link. Every entry states it: an omitted stage
// is refused, so no entry tears down a long-delay link's queue by default.
enum LinkDownStage {
  LINK_DOWN_STAGE_UNSPECIFIED = 0;
  // Long-delay ends only: this end's transmitting interface stops admitting packets; its queues
  // and delivery path stay, so packets already sent keep arriving. The acknowledgement proves
  // admission stopped, not that the contact closed.
  LINK_DOWN_STAGE_STOP_ADMISSION = 1;
  // (STOP_ADMISSION also purges this end's untransmitted backlog: the packets waiting behind its
  // transmit rate shaper never left the terminal before the contact ended. The acknowledgement
  // proves the transmit queue empty.)
  // This end's remaining link resources are removed, and what its queues still held is counted.
  // On a local link this is the whole LinkDown.
  LINK_DOWN_STAGE_CLOSE = 2;
}

// What a BatchLinkUp entry does to its end of a link. Every entry states it. A long-delay end
// opens in two stages, so no packet is admitted before both receive paths delay it: PREPARE
// builds and proves the end with its admission stopped; OPEN admits packets on a prepared end.
// A local end opens at once with OPEN.
enum LinkUpStage {
  LINK_UP_STAGE_UNSPECIFIED = 0;
  LINK_UP_STAGE_PREPARE = 1;
  LINK_UP_STAGE_OPEN = 2;
}

// What one end of a link lost, by cause. Substrate loss only: nothing here is loss the
// experiment's declared conditions cause.
message LinkEndLoss {
  // Packets this end's admission filter took while admission was stopped.
  uint64 admission_taken = 1;
  // Packets this end's delay queue dropped at its limit: traffic above the queue's envelope.
  uint64 queue_dropped = 2;
  // Packets this end's queue held when it closed.
  uint64 discarded_at_close = 3;
  // True when discarded_at_close is an exact count (nothing entered the queue during the close);
  // false when it is a queue-length sample.
  bool discarded_exact = 4;
  // Packets waiting behind this end's transmit rate shaper when admission stopped: never
  // transmitted before the contact ended. Counted by the kernel as the purge drops them.
  uint64 untransmitted_at_stop = 5;
  // Packets this end's transmit rate queue dropped at its limit: offered faster than the
  // terminal's rate, beyond what its queue holds.
  uint64 transmit_dropped = 6;
}

message CommandFailureResponse {
  bool success = 1;
  NodeAgentErrorCode error_code = 2;
  string error_message = 3;
  bool dirty_kernel = 4;
}

// --- BatchLinkDown ---

message InterfaceDown {
  string node_id = 1;
  string interface_name = 2;
  // field 3 reserved — PID looked up by Node Agent internally
  LinkType link_type = 4;
  string gs_id = 5;
  string sat_id = 6;
  // fields 7-8 reserved — PID looked up by Node Agent internally
  // CROSS_NODE VXLAN parameters (empty/zero for LOCAL)
  string remote_node_ip = 9;
  int32 vni = 10;
  // Per-interface locality
  Locality locality = 11;
  // Peer info for host-mediated ISL (host-side veth name computation)
  string peer_node_id = 12;
  string peer_interface_name = 13;
  LinkDownStage stage = 14;
  // The contact this entry ends (OME names contacts). Required on long-delay ends: a stage for a
  // contact the end no longer carries changes nothing of the contact it carries now.
  string contact_id = 15;
}

message BatchLinkDownRequest {
  CommandEnvelope envelope = 1;
  string target_sim_time = 2;
  // field 3 removed; locality moved to per-interface wiring requests.
  repeated InterfaceDown interfaces = 4;
}

message InterfaceResult {
  string node_id = 1;
  string interface_name = 2;
  bool success = 3;
  NodeAgentErrorCode error_code = 4;
  string error_message = 5;
  bool verified = 6;
  bool dirty_kernel = 7;
  string proof_summary = 8;
  repeated string proof_evidence = 9;
  // BatchLinkDown CLOSE entries and long-delay STOP_ADMISSION entries: what this end lost.
  LinkEndLoss loss = 10;
}

message BatchLinkDownResponse {
  bool success = 1;
  string error_message = 2;
  // Entries whose end closed (CLOSE). STOP_ADMISSION entries are counted apart: a stopped
  // admission is not a closed link.
  int32 interfaces_downed = 3;
  float apply_time_ms = 4;
  repeated InterfaceResult interface_results = 5;
  NodeAgentErrorCode error_code = 6;
  bool dirty_kernel = 7;
  // Entries whose admission stopped (STOP_ADMISSION).
  int32 admissions_stopped = 8;
}

// --- BatchLinkUp ---

// One terminal's own rates: what it can send and what it can receive,
// independent of the terminal at the other end of the link.
message TerminalRates {
  double transmit_mbps = 1;
  double receive_mbps = 2;
}

message InterfaceUp {
  string node_id = 1;
  string interface_name = 2;
  // field 3 reserved — PID looked up by Node Agent internally
  LinkType link_type = 4;
  // Egress delay of (node_id, interface_name): the light time of the direction it transmits.
  double latency_ms = 5;
  // field 6 reserved — one symmetric pair rate, replaced by per-terminal rates
  reserved 6;
  string gs_id = 7;
  string sat_id = 8;
  // fields 9-10 reserved — PID looked up by Node Agent internally
  // field 11 reserved — peer_mac removed with v0.72 NDP deletion
  //   (Node Agent no longer performs L3 neighbor resolution; see §13.22.6)
  reserved 11;
  // CROSS_NODE VXLAN parameters (empty/zero for LOCAL)
  string remote_node_ip = 12;
  int32 vni = 13;
  // Per-interface locality
  Locality locality = 14;
  // Peer info for host-mediated ISL (host-side veth name computation)
  string peer_node_id = 15;
  string peer_interface_name = 16;
  // Rates of the terminal behind (node_id, interface_name).
  TerminalRates rates = 17;
  // Rates of the terminal behind (peer_node_id, peer_interface_name): on LOCAL
  // ground entries, where one entry wires both ends, and on long-delay ends,
  // whose receive-side queue is sized from the peer's transmit rate.
  TerminalRates peer_rates = 18;
  // LOCAL ground entries describe both ends: the peer end's egress delay (the direction the
  // peer transmits). Unused on entries that name one end.
  double peer_latency_ms = 19;
  // Long-delay ends: the contact this LinkUp opens (OME names contacts), and the delay of the
  // direction this end receives, which its receive-side queue applies.
  string contact_id = 20;
  double receive_latency_ms = 21;
  LinkUpStage stage = 22;
}

message BatchLinkUpRequest {
  CommandEnvelope envelope = 1;
  string target_sim_time = 2;
  // field 3 removed; locality moved to per-interface wiring requests.
  repeated InterfaceUp interfaces = 4;
}

message BatchLinkUpResponse {
  bool success = 1;
  string error_message = 2;
  int32 interfaces_upped = 3;
  float apply_time_ms = 4;
  repeated InterfaceResult interface_results = 5;
  NodeAgentErrorCode error_code = 6;
  bool dirty_kernel = 7;
}

// --- SetLatency ---

message LatencyEntry {
  string node_id = 1;
  string interface_name = 2;
  // field 3 reserved — PID looked up by Node Agent internally
  double latency_ms = 4;
  LinkType link_type = 5;
  string gs_id = 6;
  string sat_id = 7;
  // fields 8-9 reserved — PID looked up by Node Agent internally
  // field 10 reserved — a bare transmit rate, replaced by the terminal's rates
  reserved 10;
  // The rates of the terminal behind this interface. The netem queue limit
  // follows its transmit rate times delay, so every delay change carries them.
  TerminalRates rates = 11;
  // Long-delay ends: the contact whose receive-side queue this entry updates, and the delay of
  // the direction this end receives.
  string contact_id = 12;
  double receive_latency_ms = 13;
  // Long-delay ends: the rates of the peer terminal, whose transmit rate sizes this end's
  // receive-side queue together with receive_latency_ms. Unset on every other entry.
  TerminalRates peer_rates = 14;
}

message SetLatencyRequest {
  CommandEnvelope envelope = 1;
  repeated LatencyEntry entries = 2;
}

message LatencyResult {
  string node_id = 1;
  string interface_name = 2;
  bool success = 3;
  NodeAgentErrorCode error_code = 4;
  string error_message = 5;
  bool verified = 6;
  bool dirty_kernel = 7;
  string proof_summary = 8;
  repeated string proof_evidence = 9;
}

message SetLatencyResponse {
  bool success = 1;
  string error_message = 2;
  int32 entries_updated = 3;
  repeated LatencyResult entry_results = 4;
  NodeAgentErrorCode error_code = 5;
  bool dirty_kernel = 6;
}

// --- KernelInventory (read-only verification) ---

message KernelInventoryEntry {
  string node_id = 1;
  string interface_name = 2;
  LinkType link_type = 3;
  string gs_id = 4;
  string sat_id = 5;
  string peer_node_id = 6;
  string peer_interface_name = 7;
  Locality locality = 8;
  int32 vni = 9;
  // Expected egress delay of (node_id, interface_name): the direction it transmits.
  double latency_ms = 10;
  // field 11 reserved — one symmetric pair rate, replaced by per-terminal rates
  reserved 11;
  bool expected_admin_up = 12;
  string remote_node_ip = 13;
  // Expected-up entries: rates of the terminal behind (node_id,
  // interface_name), and on LOCAL entries the peer terminal's rates.
  TerminalRates rates = 14;
  TerminalRates peer_rates = 15;
  // LOCAL entries prove both ends: the peer end's expected egress delay.
  double peer_latency_ms = 16;
  // Long-delay ends: the contact the end must carry, the delay of the direction it receives, and
  // whether its admission must be stopped (a draining contact) or open.
  string contact_id = 17;
  double receive_latency_ms = 18;
  bool expected_admission_stopped = 19;
  // Long-delay ends only: report what the end carries (its contact, admission, receive queue)
  // and prove nothing. A restarted Scheduler surveys every long-delay end before it dispatches.
  bool survey = 20;
}

message KernelInventoryRequest {
  CommandEnvelope envelope = 1;
  string target_sim_time = 2;
  string gs_id = 3;
  repeated KernelInventoryEntry entries = 4;
}

message KernelInventoryEntryResult {
  string node_id = 1;
  string interface_name = 2;
  bool success = 3;
  NodeAgentErrorCode error_code = 4;
  string error_message = 5;
  bool verified = 6;
  bool dirty_kernel = 7;
  string proof_summary = 8;
  repeated string proof_evidence = 9;
  // A survey's report: the contact the end carries (empty: none), whether its admission is
  // stopped, and the delay its receive queue holds (0: no receive queue).
  string carried_contact_id = 10;
  bool admission_stopped = 11;
  double receive_latency_ms = 12;
  // The peer end the carried contact names ("node/interface"), "" when none.
  string carried_peer = 13;
}

message KernelInventoryResponse {
  bool success = 1;
  string error_message = 2;
  int32 entries_verified = 3;
  float apply_time_ms = 4;
  repeated KernelInventoryEntryResult entry_results = 5;
  NodeAgentErrorCode error_code = 6;
  bool dirty_kernel = 7;
}
