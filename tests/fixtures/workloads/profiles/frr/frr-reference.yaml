# The built-in FRR reference profile, expressed as a package fixture.
# Image digests are structural placeholders pending the shipped package.
node_workload_profile:
  schema_version: '1'
  id: frr-reference
  description: 'Built-in FRR reference profile: adapter-rendered native configuration
    consumed by the FRR workload container.'
  volumes:
  - name: frr-config-rendered
    kind: ephemeral
    medium: memory
    size_mi: 8
  - name: frr-etc
    kind: ephemeral
    medium: node
    size_mi: 8
  - name: frr-run
    kind: ephemeral
    medium: memory
    size_mi: 8
  - name: tmp
    kind: ephemeral
    medium: memory
    size_mi: 16
  - name: var-log
    kind: ephemeral
    medium: memory
    size_mi: 32
  - name: etc-ssh
    kind: ephemeral
    medium: memory
    size_mi: 1
  - name: home-operator
    kind: ephemeral
    medium: memory
    size_mi: 4
  init_containers:
  - name: frr-adapter
    image: registry.example/nodalarc/frr@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    resources:
      requests:
        cpu_m: 100
        memory_mi: 128
      limits:
        cpu_m: 1000
        memory_mi: 512
    capabilities: []
    root_filesystem: read_only
    volume_mounts:
    - volume: frr-config-rendered
      path: /out
      read_only: false
  workload_containers:
  - name: frr
    image: registry.example/nodalarc/frr@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    resources:
      requests:
        cpu_m: 100
        memory_mi: 128
      limits:
        cpu_m: 1000
        memory_mi: 512
    capabilities:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - NET_ADMIN
    - NET_BIND_SERVICE
    - NET_RAW
    - SETGID
    - SETUID
    - SYS_ADMIN
    root_filesystem: read_only
    volume_mounts:
    - volume: frr-config-rendered
      path: /etc/frr-config
      read_only: true
    - volume: frr-etc
      path: /etc/frr
      read_only: false
    - volume: frr-run
      path: /var/run/frr
      read_only: false
    - volume: tmp
      path: /tmp
      read_only: false
    - volume: var-log
      path: /var/log
      read_only: false
    - volume: etc-ssh
      path: /etc/ssh
      read_only: false
    - volume: home-operator
      path: /home/operator
      read_only: false
  artifacts:
    static:
    - file: daemons
      sha256: f378230a828056cc95aa596589ca08f0b5eaef3a0fbb3facb9ba0e1c4c163e01
      container: frr
      path: /etc/frr-static/daemons
      read_only: true
    plan:
      container: frr
      path: /etc/frr-plan
      read_only: true
  routing_realization:
    container: frr
    realizes:
    - protocol: isis
      capabilities:
      - mpls
      - segment_routing
      - traffic_engineering
    - protocol: ospf
      capabilities:
      - mpls
      - segment_routing
      - traffic_engineering
    - protocol: static
      capabilities: []
  readiness:
    container: frr
    argv:
    - /bin/sh
    - -c
    - test -f /etc/frr/.config_version && test -f /etc/frr-config/_config_version
      && [ "$(cat /etc/frr/.config_version)" = "$(cat /etc/frr-config/_config_version)"
      ] && vtysh -c 'show version'
    timeout_seconds: 5
    period_seconds: 2
